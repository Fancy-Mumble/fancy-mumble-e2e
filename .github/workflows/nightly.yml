# Nightly e2e sweep, run only when something under test has actually moved.
#
# The harness pins its systems under test as submodules, but those systems are
# developed on their own branches: the pinned commit says what was last vetted,
# not what is current. So the cheap `detect` job asks each watched submodule's
# remote for its tracked branch tip and compares that against the tips of the
# last run, recorded on the `nightly-state` branch. Unchanged tips mean a sweep
# would re-measure a state already measured, so `e2e` is skipped entirely.
#
# `record` writes the tips back whether the suite passed or failed. A red night
# that re-armed itself would run the same two-hour sweep against the same code
# every night until someone fixed it; use the `force` dispatch input to re-run.
name: nightly

on:
  schedule:
    # 02:23 UTC - off the top of the hour, where scheduled runs queue worst.
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Run the suite even if no watched submodule moved
        type: boolean
        default: false

concurrency:
  # Queue, never cancel: a sweep is ~2h of build and the tips it is testing are
  # already recorded as pending. Killing one wastes the whole run.
  group: nightly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    name: detect submodule movement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.compare.outputs.changed }}
      state: ${{ steps.compare.outputs.state }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the last run's tips
        run: |
          set -euo pipefail
          if git fetch -q --depth 1 origin nightly-state 2>/dev/null \
            && git show FETCH_HEAD:state.json > "$RUNNER_TEMP/prev.json" 2>/dev/null; then
            echo "previous state:"; cat "$RUNNER_TEMP/prev.json"
          else
            echo '{}' > "$RUNNER_TEMP/prev.json"
            echo "no nightly-state yet - first run, every tip counts as moved"
          fi

      - name: Resolve current tips
        id: compare
        env:
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
          FORCE: ${{ inputs.force }}
          # vendor/server + vendor/docker: murmur only, and those suites skip
          # themselves here. vendor/wren: nothing in the harness references it.
          # vendor/mumble-user-manager: not exercised - its stack wants 64738,
          # which the shared Starling owns.
          EXCLUDE: "vendor/server vendor/docker vendor/wren vendor/mumble-user-manager"
        run: |
          set -euo pipefail

          # Four of the watched repos are private; ls-remote needs a credential.
          if [ -n "${SUBMODULE_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi

          state='{}'
          failed=0
          while read -r key path; do
            case " $EXCLUDE " in *" $path "*) continue ;; esac
            name=${key#submodule.}; name=${name%.path}
            url=$(git config -f .gitmodules --get "submodule.${name}.url")
            branch=$(git config -f .gitmodules --get "submodule.${name}.branch" || echo HEAD)
            [ "$branch" = HEAD ] && ref=HEAD || ref="refs/heads/$branch"

            if ! out=$(git ls-remote "$url" "$ref" 2>&1); then
              echo "::error::${path}: cannot reach ${url} - expired SUBMODULE_TOKEN, or no access."
              failed=1; continue
            fi
            sha=$(awk 'NR==1{print $1}' <<<"$out")
            if [ -z "$sha" ]; then
              # Never fall back to HEAD here. A branch key that silently stopped
              # resolving is exactly how vendor/starling sat on a deleted branch
              # for weeks while `submodule update --remote` followed the wrong ref.
              echo "::error::${path}: branch '${branch}' does not exist on ${url}. Fix the branch key in .gitmodules."
              failed=1; continue
            fi
            state=$(jq -c --arg p "$path" --arg u "$url" --arg b "$branch" --arg s "$sha" \
              '.[$p] = {url:$u, branch:$b, sha:$s}' <<<"$state")
          done < <(git config -f .gitmodules --get-regexp '\.path$')
          [ "$failed" -eq 0 ] || exit 1

          changed=false
          if [ "${FORCE:-}" = "true" ]; then changed=true; fi
          {
            echo "### Watched submodules"
            echo
            echo "| submodule | branch | last run | now |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          for p in $(jq -r 'keys[]' <<<"$state"); do
            cur=$(jq -r --arg p "$p" '.[$p].sha' <<<"$state")
            br=$(jq -r --arg p "$p" '.[$p].branch' <<<"$state")
            old=$(jq -r --arg p "$p" '.[$p].sha // ""' "$RUNNER_TEMP/prev.json")
            mark=""
            if [ "$old" != "$cur" ]; then changed=true; mark=" **moved**"; fi
            echo "| \`$p\` | $br | ${old:0:12} | ${cur:0:12}${mark} |" >> "$GITHUB_STEP_SUMMARY"
          done
          if [ "${FORCE:-}" = "true" ]; then
            printf '\n_Forced run: the suite runs regardless._\n' >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "changed=$changed"

  e2e:
    name: e2e sweep
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ${{ vars.NIGHTLY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 180
    env:
      # Two Rust release workspaces on one runner disk. Incremental artifacts
      # bought nothing here (every run is cold or cache-restored) and once ate
      # 62 GB locally.
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Free disk space
        if: runner.environment == 'github-hosted'
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/share/boost "${AGENT_TOOLSDIRECTORY:-}/CodeQL" || true
          df -h /

      - uses: actions/checkout@v4

      # Not `submodules: true`: that restores the pinned gitlinks, and the pins
      # are precisely what this run is NOT testing. Taking detect's SHAs also
      # closes the gap between deciding to run and checking out - what the run
      # built is exactly what `record` writes down.
      - name: Check out watched submodules at the detected tips
        env:
          STATE: ${{ needs.detect.outputs.state }}
          SUBMODULE_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${SUBMODULE_TOKEN:-}" ]; then
            git config --global \
              url."https://x-access-token:${SUBMODULE_TOKEN}@github.com/".insteadOf \
              "https://github.com/"
          fi
          jq -r 'to_entries[] | [.key, .value.url, .value.sha] | @tsv' <<<"$STATE" |
          while IFS=$'\t' read -r path url sha; do
            echo "==> $path @ ${sha:0:12}"
            mkdir -p "$path"
            git init -q "$path"
            git -C "$path" remote add origin "$url"
            git -C "$path" fetch -q --depth 1 origin "$sha" \
              || git -C "$path" fetch -q origin
            git -C "$path" checkout -q --detach "$sha"
          done

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            vendor/client
            vendor/starling

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev \
            protobuf-compiler webkit2gtk-driver xvfb python3-tk

      - name: Install Tauri CLI + tauri-driver
        uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli, tauri-driver

      # tauri.conf.json's beforeBuildCommand runs `npm run build`, not `npm ci`.
      - name: Install client UI dependencies
        working-directory: vendor/client/crates/mumble-tauri/ui
        run: npm ci

      # Not a bare `cargo tauri build`: that omits libsignal_bridge.so and the
      # denoiser feature, and the suites that need them then fail as if the
      # product were broken. --no-qt6ui because the runner has no Qt kit; the
      # ghost-session suite gates itself on the binary.
      - name: Build client
        run: scripts/build-client.sh --no-qt6ui

      - name: Build Starling
        working-directory: vendor/starling
        run: cargo build --release -p starling

      - name: Install e2e dependencies
        run: npm ci

      - name: Start the channelviewer stack
        run: |
          docker compose -f fixtures/docker-compose.e2e.yml \
            --profile channelviewer up -d --build --wait
        env:
          CHANNELVIEWER_TEST_LOGIN: "1"

      - name: Run the suite
        env:
          E2E_APP_BIN: ${{ github.workspace }}/vendor/client/target/release/mumble-tauri
          E2E_STARLING_BIN: ${{ github.workspace }}/vendor/starling/target/release/starling
          # Both assert an fps floor against a live 60 Hz source. On a
          # software-rendered Xvfb desktop they fail on merit, every night.
          E2E_SKIP: screenshare.gpu.test.ts,screenshare.performance.test.ts
        run: xvfb-run -a npm run e2e

      - name: Run the private-server suites
        if: ${{ !cancelled() }}
        env:
          E2E_APP_BIN: ${{ github.workspace }}/vendor/client/target/release/mumble-tauri
          E2E_STARLING_BIN: ${{ github.workspace }}/vendor/starling/target/release/starling
        run: xvfb-run -a npm run e2e:private

      - name: Stop the stack
        if: always()
        run: docker compose -f fixtures/docker-compose.e2e.yml --profile "*" down -v

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ github.run_id }}
          path: |
            screenshots/
            test-results/
            .tmp/
          if-no-files-found: ignore
          retention-days: 14

  record:
    name: record tips
    needs: [detect, e2e]
    if: ${{ !cancelled() && needs.detect.result == 'success' && needs.detect.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Commit the tested tips to nightly-state
        env:
          STATE: ${{ needs.detect.outputs.state }}
          RESULT: ${{ needs.e2e.result }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init -q -b nightly-state state
          cd state
          git remote add origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin nightly-state 2>/dev/null; then
            git reset -q FETCH_HEAD
          fi
          jq . <<<"$STATE" > state.json
          git add state.json
          if git diff --cached --quiet; then
            echo "tips unchanged (forced re-run) - nothing to record"
          else
            git -c user.name='github-actions[bot]' \
                -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                commit -q -m "nightly ${GITHUB_RUN_ID}: e2e=${RESULT}"
            git push -q origin HEAD:nightly-state
            echo "recorded (e2e=${RESULT})"
          fi
