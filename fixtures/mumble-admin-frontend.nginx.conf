# nginx for the admin UI: static bundle plus a same-origin route to Starling.
#
# The Health page reads Starling's operator API, which is a *different* server
# from the Mumble admin backend the rest of this UI talks to - a separate
# process, on a separate port, with its own credential.
#
# # Why this is proxied when the rest of the admin UI is not
#
# The other admin calls go straight from the browser to `:5005` on purpose:
# routing them through this nginx would make them arrive from *this container*,
# and the channelviewer's test-login fence refuses that - rightly, since the
# bypass is for the host alone.
#
# Starling has no such fence. `operator-api` authenticates with a bearer token,
# which nginx forwards untouched, so where the request appears to come from
# does not change the answer. That frees the proxy to solve two problems the
# direct call could not:
#
#   * **CORS.** `operator-api` sends no `Access-Control-Allow-Origin` at all, so
#     a browser on `:5007` calling `:8081` directly is blocked before Starling
#     ever sees it. Same-origin means the question never arises.
#   * **`host.docker.internal` is not a browser name.** It resolves inside a
#     container, which is exactly where nginx is and exactly where the browser
#     is not. Baking it into the bundle produced "Failed to fetch" against a
#     hostname the browser could never have looked up.
#
# Mounted over the image's own conf rather than committed upstream, for the
# same reason as the viewer's: a proxy target of `host.docker.internal` only
# means anything inside this compose file.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    sendfile on;
    keepalive_timeout 65;
    gzip on;

    # The bearer Starling's operator API expects.
    #
    # Injected here rather than carried by the browser, because in
    # `CHANNELVIEWER_TEST_LOGIN` mode there is no token in the page to send -
    # the bypass mints none - and a Health panel that always reads 401 is worse
    # than no panel. A browser that *does* send an Authorization header keeps
    # it; this only fills the gap.
    #
    # Fixture-only, and safe only because of where it sits: this proxy is
    # reachable from the loopback-bound admin UI alone. Do not copy the pattern
    # to anything published.
    map $http_authorization $starling_auth {
        default   $http_authorization;
        ""        "Bearer e2e-token";
    }

    server {
        listen 80;
        server_name _;

        # Starling's operator API. The trailing slash on both sides strips the
        # prefix, so `/starling/v1/health` reaches Starling as `/v1/health`.
        #
        # The bundle is built with `STARLING_URL=/starling`, a *relative* base -
        # which is what makes this same-origin and is the whole point.
        location /starling/ {
            proxy_pass http://host.docker.internal:8081/;
            proxy_http_version 1.1;
            # Forwarded verbatim: this is the credential operator-api checks,
            # and nginx drops unknown headers on a proxy_pass without it.
            proxy_set_header Authorization $starling_auth;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # Short, because this sits behind a dashboard that polls every few
            # seconds. A Starling that is down should paint the page red
            # promptly rather than leave it spinning for a minute.
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        # A single-page app: paths belong to the client-side router, so anything
        # that is not a real file falls back to the bundle rather than 404ing.
        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
            try_files $uri $uri/ /index.html;
        }
    }
}
