; Fancy Mumble e2e test server config.
; Relaxed limits + all Fancy features on, so the suite can exercise the full
; client/server surface unattended. NOT a production config.

database=/data/mumble-server.sqlite
port=64738
host=0.0.0.0
users=100
bandwidth=320000

; No client certificate or server password required -> anonymous connects work.
certrequired=false
serverpassword=

; Make text/image tests deterministic and generous.
opusthreshold=0
textmessagelength=131072
imagemessagelength=10485760
allowhtml=true
welcometext=<b>Fancy Mumble e2e test server</b>

; Disable auto-ban so the rapid connect/disconnect cycles in tests are not
; mistaken for abuse.
autobanAttempts=0
autobanTimeframe=0
autobanTime=0

; -- Persistent chat (Fancy fork) ------------------------------------------
pchatenabled=true
pchatrequireregistration=false

; -- File-server plugin (HTTP uploads on :64739) ---------------------------
; NOTE: verify these keys against the server's plugin config schema
; (vendor/server/3rdparty/mumble-plugin-host/file-server) when wiring the
; Phase 4 file-server test; names below follow the docker README.
plugin.file-server.enabled=true
plugin.file-server.storagePath=/data/file-server-storage
plugin.file-server.bindAddress=0.0.0.0
plugin.file-server.port=64739
plugin.file-server.tlsTerminatedByProxy=true

; -- Live-doc plugin (collab WebSocket on :64740) --------------------------
; NOTE: confirm key names against vendor/server/.../live-doc before the
; Phase 4 live-doc test; enabling left commented until verified so it does
; not block server startup.
; plugin.live-doc.enabled=true
; plugin.live-doc.bindAddress=0.0.0.0
; plugin.live-doc.port=64740
