; Fancy Mumble e2e test server config.
; Relaxed limits + all Fancy features on, so the suite can exercise the full
; client/server surface unattended. NOT a production config.

database=/data/mumble-server.sqlite
port=64738
host=0.0.0.0
users=100
bandwidth=320000

; No client certificate or server password required -> anonymous connects work.
certrequired=false
serverpassword=

; Make text/image tests deterministic and generous.
opusthreshold=0
textmessagelength=131072
imagemessagelength=10485760
allowhtml=true
welcometext=<b>Fancy Mumble e2e test server</b>
; Public server name. NB the ini key is camelCase `registerName` (case-sensitive
; on Linux); the channel viewer reads it back via Ice getDefaultConf["registername"].
registerName=Fancy Mumble e2e

; Disable auto-ban so the rapid connect/disconnect cycles in tests are not
; mistaken for abuse.
autobanAttempts=0
autobanTimeframe=0
autobanTime=0

; -- ZeroC Ice admin interface (for the channel viewer) --------------------
; Bound on all interfaces so the in-network channel viewer (vendor/channelviewer,
; started via the `channelviewer` compose profile) can read the channel tree over
; Ice. No read/write secret -> fully open; acceptable for this throwaway test
; fixture only. The dev server image is built with -Dice=ON (vendor/docker/
; Dockerfile.dev).
ice="tcp -h 0.0.0.0 -p 6502"

; -- Persistent chat (Fancy fork) ------------------------------------------
pchatenabled=true
pchatrequireregistration=false

; -- File-server plugin (HTTP uploads on :64739) ---------------------------
; Plugin id is "fancy-file-server"; keys are snake_case (file-server/src/config.rs).
; storage_path must be absolute (auto-created); a non-loopback bind_address
; requires tls_terminated_by_proxy=true.
plugin.fancy-file-server.enabled=true
plugin.fancy-file-server.storage_path=/data/file-server-storage
plugin.fancy-file-server.bind_address=0.0.0.0
plugin.fancy-file-server.port=64739
plugin.fancy-file-server.tls_terminated_by_proxy=true
; Shared secret so the live-doc plugin can persist via the file-server.
plugin.fancy-file-server.admin_token=e2e-livedoc-fileserver-shared-secret

; -- Live-doc plugin (collab WebSocket on :64740) --------------------------
; Plugin id is "fancy-live-doc". Default host is 0.0.0.0:64740 (reachable via the
; mapped port). file_server_* must match the file-server admin_token above.
plugin.fancy-live-doc.enabled=true
plugin.fancy-live-doc.state_path=/data/live-doc-state
plugin.fancy-live-doc.file_server_url=http://127.0.0.1:64739
plugin.fancy-live-doc.file_server_admin_token=e2e-livedoc-fileserver-shared-secret

; -- Link-preview plugin ---------------------------------------------------
; Server forwards FancyLinkPreviewRequest to this plugin, which fetches the URL
; and returns an OpenGraph/HTML embed. No port (request/response over the control
; channel). SSRF-guarded, so previews only work for public URLs.
plugin.fancy-link-preview.enabled=true

; -- Calendar plugin -------------------------------------------------------
; Relays meetings/invites/free-busy between participants over the control
; channel; calendars are stored per-user in the file-server private store. No
; port, no disk storage.
plugin.fancy-calendar.enabled=true

; -- Friends plugin --------------------------------------------------------
; Backs friend direct messages (and a self-notepad) with detached, end-to-end-
; encrypted (signal_v1), persisted channels between registered users. No port,
; no disk storage.
plugin.fancy-friends.enabled=true
