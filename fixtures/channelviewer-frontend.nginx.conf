# nginx for the channel-viewer UI: static bundle plus a same-origin API.
#
# The frontend's `API_BASE` defaults to a relative `/api/v1` (src/api.ts), and
# that default is the one worth keeping. The alternative - building with
# `VITE_API_URL=http://127.0.0.1:5005` - bakes a host and port into the bundle
# at compile time and makes every call cross-origin, which then needs
# `ADMIN_CORS_ORIGINS` set to match. Proxying instead means the browser sees one
# origin, so none of that arises.
#
# Mounted over the image's default conf rather than committed upstream: the
# frontend is its own repository, and a proxy target named `channelviewer`
# only makes sense inside this compose file.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A single-page app: paths belong to the client-side router, so anything
    # that is not a real file falls back to the bundle rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/v1/ {
        proxy_pass http://channelviewer:5000;
        proxy_http_version 1.1;

        # `/api/v1/stream` is Server-Sent Events, and the defaults break it in
        # two separate ways: nginx buffers the response, so nothing reaches the
        # browser until the buffer fills, and it closes the upstream at 60s, so
        # a live view dies once a minute. Both are turned off here rather than
        # in the app, because both are nginx's doing.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        # SSE is HTTP/1.1 without keep-alive semantics from the proxy's side;
        # an empty Connection header stops nginx sending `close` upstream.
        proxy_set_header Connection '';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
