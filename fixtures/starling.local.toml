# Starling for the local channelviewer + admin stack.
#
# A configuration file overlays Starling's built-in defaults rather than
# replacing them, so this file is only the delta: everything not named here --
# the service map, the routing table, the rate-limit buckets -- comes from the
# defaults. There is nothing to regenerate when the example changes.
#
# Run it from vendor/starling so `data_dir` lands beside the binary:
#   $env:STARLING_ADMIN_TOKEN = 'e2e-token'
#   target/release/starling --all-in-one --config ../../fixtures/starling.local.toml
#
# The token must match the one the admin UI's nginx injects
# (fixtures/mumble-admin-frontend.nginx.conf).

[runtime]
# One process, and the local transport for whichever platform this is: a Unix
# socket, or a named pipe on Windows. `--all-in-one` on the command line sets
# this too; it is here so the file alone is enough.
all_in_one = true
data_dir = "starling-data"

# -- The admin plane --------------------------------------------------------
#
# Off by default, so the e2e stack switches it on.

[services.operator-api]
enabled = true
# 0.0.0.0, not 127.0.0.1: the admin UI's nginx reaches this from inside a
# container via `host.docker.internal`, which resolves to the host's gateway
# address rather than its loopback. Bound to loopback only, the container cannot
# reach it at all and the Health page reports it unreachable.
listen = "0.0.0.0:8081"
tier = "optional"

[services.operator-api.auth]
mode = "token"

# The weakest mode, and the right one for a laptop: no identity, no expiry.
# Set STARLING_ADMIN_TOKEN to `e2e-token` before starting, matching what the
# admin UI's nginx injects (fixtures/mumble-admin-frontend.nginx.conf).
[services.operator-api.auth.token]
# The variable's name, never the secret itself.
tokens = [{ value_env = "STARLING_ADMIN_TOKEN", scopes = ["*"] }]

[services.operator-api.audit]
# Under `data_dir`, not /var/log: this runs unprivileged from a checkout.
path = "starling-data/operator-audit.log"
fail_closed = true
